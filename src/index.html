<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <nav>
      <button id="back-btn" disabled>Back</button>
      <button id="reload-btn" disabled>Reload</button>
      <input type="text" id="address-bar" placeholder="Enter URL"
        onkeydown="if(event.key === 'Enter') { window.open(document.getElementById('address-bar').value); }" />
      <button id="go-btn" 
        onclick="window.open(document.getElementById('address-bar').value)"
      >Go</button>
      <button id="settings-btn">Settings</button>
    </nav>
    <main class="container">
      <iframe id="content-iframe" srcdoc="
        <div>
          <p>Hi :></p>
        </div>
      ">
      </iframe>
      <iframe id="settings-iframe" src="settings.html" style="display: none;"></iframe>
      <div id="disclaimer">
        //TODO: Add a disclaimer here
      </div>
    </main>
  </body>
</html>
