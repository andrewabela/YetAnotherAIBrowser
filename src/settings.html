<div class="settings-container">
    <link rel="stylesheet" href="styles.css" />
    <h1>Settings</h1>
    <button id="close-settings-btn" class="close-settings-btn">Close Settings</button>
    
    <div class="settings-form">
        <label for="llm-provider">AI Provider:</label>
        <select id="llm-provider">
            
        </select><br/>
        
        <label for="llm-provider-endpoint">AI Provider Endpoint:</label>
        <input type="text" id="llm-provider-endpoint" placeholder="Enter endpoint URL" /><br/>
        
        <label for="llm-provider-key">AI Provider API Key:</label>
        <input type="password" id="llm-provider-key" placeholder="Enter API key" /><br/>
        
        <label for="llm-provider-model">AI Provider Model:</label>
        <input type="text" id="llm-provider-model" placeholder="Enter model name" /><br/>
    </div>
    
    <div class="settings-info">
        <small>Settings are saved automatically.</small>
    </div>
</div>
